server=/dl.l.google.com/119.29.29.29
server=/update.googleapis.com/119.29.29.29
server=/*.dl.playstation.net/119.29.29.29
server=/amplifi.lan/system
server=/router.synology.com/system
server=/sila.razer.com/system
server=/router.asus.com/system
server=/routerlogin.net/system
server=/orbilogin.com/system
server=/www.LinksysSmartWiFi.com/system
server=/LinksysSmartWiFi.com/system
server=/myrouter.local/system
server=/www.miwifi.com/system
server=/miwifi.com/system
server=/mediarouter.home/system
server=/tplogin.cn/system
server=/tplinklogin.net/system
server=/melogin.cn/system
server=/falogin.cn/system


# =====================================
# 策略组
# static：你需要手动选择想要的节点/策略组。
# available：将按顺序选择你列表中第一个可用的节点。
# round-robin：将按列表的顺序轮流使用其中的节点。
# url-latency-benchmark：选取延迟最优节点。
# dest-hash：随机负载均衡，但相同域名走固定节点。
# ssid：将根据你所设定的网络来自动切换节点/策略组。
# =====================================
[policy]
static=苹果服务, direct, proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=谷歌服务, proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=电报消息, proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=Spotify, proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=人工智能, proxy, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=大陆抖音, direct, proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=海外抖音, proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
static=兜底策略, direct,proxy, 香港节点, 台湾节点, 美国节点, 日本节点, 韩国节点, 狮城节点
url-latency-benchmark=香港节点, server-tag-regex=港|HK|Hong|🇭🇰, check-interval=600, tolerance=100, alive-checking=false
url-latency-benchmark=台湾节点, server-tag-regex=台|TW|Taiwan, check-interval=600, tolerance=100, alive-checking=false
url-latency-benchmark=美国节点, server-tag-regex=美|US|States|American|🇺🇸, check-interval=600, tolerance=0
url-latency-benchmark=日本节点, server-tag-regex=日|JP|Japan|🇯🇵, check-interval=600, tolerance=100, alive-checking=false
url-latency-benchmark=韩国节点, server-tag-regex=韩|KR|Korea|🇰🇷, check-interval=600, tolerance=100, alive-checking=false
url-latency-benchmark=狮城节点, server-tag-regex=新加坡|狮|獅|SG|🇸🇬, check-interval=600, tolerance=100, alive-checking=false
static=回家专线, RT-AX86U, direct

